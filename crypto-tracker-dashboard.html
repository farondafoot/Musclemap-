<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CryptoTracker — Live Wallet Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0b;--s1:#111113;--s2:#19191c;--s3:#222226;
  --b1:#2a2a30;--b2:#38383f;--b3:#52525c;
  --t1:#ededef;--t2:#8b8b96;--t3:#4a4a54;
  --hi:#5b8def;--hi2:#4070d4;
  --success:#30c48a;--warn:#f0a030;--danger:#e05050;--orange:#f07030;
  --r:10px;--r2:6px;
  --ff:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--ff);font-size:14px;overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--s1)}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
a{color:inherit;text-decoration:none}
button{font-family:var(--ff);cursor:pointer;border:none;background:none;color:inherit}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:210px;flex-shrink:0;background:var(--s1);border-right:1px solid var(--b1);display:flex;flex-direction:column;padding:20px 0}
.main{flex:1;overflow-y:auto;padding:28px 32px}
.logo{padding:0 18px 24px;border-bottom:1px solid var(--b1);margin-bottom:12px}
.logo-name{font-size:15px;font-weight:800;letter-spacing:.04em;color:var(--t1)}
.logo-name span{color:var(--hi)}
.logo-sub{font-size:11px;color:var(--t3);margin-top:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:var(--r2);margin:0 6px;font-size:13.5px;color:var(--t2);cursor:pointer;transition:all .15s;user-select:none}
.nav-item:hover{background:var(--b1);color:var(--t1)}
.nav-item.active{background:rgba(91,141,239,.12);color:var(--hi);font-weight:500}
.nav-icon{width:18px;text-align:center;font-size:14px}
.sidebar-footer{padding:14px 16px;border-top:1px solid var(--b1);margin-top:auto}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--t3);margin-right:6px}
.status-dot.live{background:var(--success);animation:pulse 2s infinite}
.status-dot.polling{background:var(--warn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.page-header{margin-bottom:24px}
.page-title{font-size:22px;font-weight:700;color:var(--t1)}
.page-sub{font-size:13px;color:var(--t3);margin-top:4px}
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:20px}
.card-sm{padding:14px 18px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat-label{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.stat-value{font-size:26px;font-weight:700}
.stat-sub{font-size:12px;color:var(--t3);margin-top:4px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:15px;font-weight:600;color:var(--t1)}
.see-all{font-size:12px;color:var(--hi);cursor:pointer}
.see-all:hover{text-decoration:underline}
.score-badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.score-high{background:rgba(48,196,138,.12);color:var(--success)}
.score-med{background:rgba(91,141,239,.12);color:var(--hi)}
.score-low{background:rgba(240,160,48,.12);color:var(--warn)}
.score-bad{background:rgba(224,80,80,.12);color:var(--danger)}
.risk-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.risk-SAFE,.risk-LOW{background:rgba(48,196,138,.1);color:var(--success)}
.risk-MEDIUM{background:rgba(240,160,48,.1);color:var(--warn)}
.risk-HIGH{background:rgba(240,112,48,.1);color:var(--orange)}
.risk-CRITICAL{background:rgba(224,80,80,.1);color:var(--danger)}
.flag-chip{display:inline-flex;padding:2px 7px;border-radius:20px;font-size:10.5px;font-weight:500;margin:2px 2px 0 0;background:rgba(240,112,48,.1);color:var(--orange)}
.buy-badge{background:rgba(48,196,138,.1);color:var(--success);font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.sell-badge{background:rgba(224,80,80,.1);color:var(--danger);font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.table{width:100%;border-collapse:collapse}
.table th{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:500;padding:0 10px 12px;text-align:left;border-bottom:1px solid var(--b1)}
.table th.r,.table td.r{text-align:right}
.table tr:hover td{background:var(--s2)}
.table td{padding:13px 10px;border-bottom:1px solid rgba(42,42,48,.6);font-size:13.5px}
.wallet-label{font-weight:500;color:var(--t1)}
.wallet-addr{font-size:11px;color:var(--t3);font-family:var(--mono);margin-top:2px}
.rank{color:var(--t3);font-size:12px}
.trade-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;transition:border-color .15s}
.trade-card:hover{border-color:var(--b2)}
.trade-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.trade-left{display:flex;align-items:center;gap:10px;min-width:0}
.trade-token{font-size:14px;font-weight:600}
.trade-value{font-size:13px;color:var(--t2);margin-left:4px}
.trade-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:8px;font-size:11.5px;color:var(--t3)}
.trade-meta a{color:var(--hi)}
.time-ago{font-size:12px;color:var(--t3);flex-shrink:0}
.score-ring-wrap{display:flex;align-items:center;gap:20px;margin-bottom:24px}
.wallet-detail-meta{flex:1}
.wallet-detail-name{font-size:20px;font-weight:700}
.wallet-detail-addr{font-size:12px;color:var(--t3);font-family:var(--mono);margin-top:4px}
.alert-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:14px 16px;margin-bottom:8px}
.alert-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sent-badge{font-size:11px;color:var(--success)}
.unsent-badge{font-size:11px;color:var(--t3)}
.filter-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border-radius:20px;font-size:12px;border:1px solid var(--b1);color:var(--t2);cursor:pointer;transition:all .15s;background:none}
.filter-btn:hover,.filter-btn.active{border-color:var(--hi);color:var(--hi);background:rgba(91,141,239,.08)}
.empty{text-align:center;padding:60px 20px;color:var(--t3)}
.empty-icon{font-size:40px;margin-bottom:12px}
.input{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r2);padding:10px 14px;color:var(--t1);font-family:var(--ff);font-size:13.5px;width:100%;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--hi)}
.btn-primary{background:var(--hi);color:#fff;border-radius:var(--r2);padding:10px 18px;font-size:13.5px;font-weight:500;cursor:pointer;transition:background .15s;border:none;white-space:nowrap}
.btn-primary:hover{background:var(--hi2)}
.btn-secondary{background:var(--s2);color:var(--t2);border-radius:var(--r2);padding:10px 18px;font-size:13.5px;font-weight:500;cursor:pointer;border:1px solid var(--b1);transition:all .15s}
.btn-secondary:hover{border-color:var(--b2);color:var(--t1)}
.btn-danger{background:rgba(224,80,80,.1);color:var(--danger);border-radius:var(--r2);padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid rgba(224,80,80,.2);transition:all .15s}
.btn-danger:hover{background:rgba(224,80,80,.2)}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;color:var(--t3);margin-bottom:6px;display:block}
.live-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--success);background:rgba(48,196,138,.08);padding:3px 9px;border-radius:20px}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--success);animation:pulse 1.5s infinite}
.score-ring{flex-shrink:0}
@media(max-width:900px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-2{grid-template-columns:1fr}
  .sidebar{width:180px}
  .main{padding:16px}
}
@media(max-width:600px){
  .sidebar{width:52px}
  .nav-item span:last-child{display:none}
  .logo-name,.logo-sub{display:none}
  .main{padding:14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-name">Crypto<span>Tracker</span></div>
      <div class="logo-sub">Live Wallet Intelligence</div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <div style="font-size:12px;color:var(--t2)">
        <span class="status-dot" id="sdot"></span><span id="stxt">Idle</span>
      </div>
      <div id="poll-status" style="font-size:11px;color:var(--t3);margin-top:4px;line-height:1.4"></div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>
// ── STATE ────────────────────────────────────────────────────────
const PFX = 'ct2_';
const ls  = k => localStorage.getItem(PFX+k);
const sl  = (k,v) => localStorage.setItem(PFX+k, v);

const ST = {
  heliusKey:'', telegramToken:'', telegramChatId:'', minScore:50,
  wallets:[], alerts:[],
  load(){
    this.heliusKey      = ls('hk')  || '';
    this.telegramToken  = ls('tgt') || '';
    this.telegramChatId = ls('tgc') || '';
    this.minScore       = Number(ls('ms')) || 50;
    try{ this.wallets = JSON.parse(ls('wallets'))||[]; }catch{ this.wallets=[]; }
    try{ this.alerts  = JSON.parse(ls('alerts')) ||[]; }catch{ this.alerts=[];  }
  },
  save(){
    sl('hk',  this.heliusKey);
    sl('tgt', this.telegramToken);
    sl('tgc', this.telegramChatId);
    sl('ms',  this.minScore);
    sl('wallets', JSON.stringify(this.wallets));
    sl('alerts',  JSON.stringify(this.alerts));
  },
};

// ── API CLIENTS ──────────────────────────────────────────────────
const Helius = {
  async getSwaps(address, limit=20){
    if(!ST.heliusKey) throw new Error('No Helius key');
    const url = `https://api.helius.xyz/v0/addresses/${address}/transactions?api-key=${ST.heliusKey}&type=SWAP&limit=${limit}`;
    const r = await fetch(url);
    if(!r.ok){ const t=await r.text().catch(()=>''); throw new Error(`Helius ${r.status}: ${t.slice(0,60)}`); }
    return r.json();
  }
};

const Dex = {
  _c: new Map(),
  async token(mint){
    const c=this._c.get(mint);
    if(c && Date.now()-c.ts<90000) return c.v;
    try{
      const r = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${mint}`);
      const j = r.ok ? await r.json() : null;
      const v = j?.pairs?.[0] ?? null;
      this._c.set(mint,{ts:Date.now(),v});
      return v;
    }catch{ return null; }
  }
};

const TG = {
  async send(text){
    if(!ST.telegramToken||!ST.telegramChatId) return false;
    try{
      const r = await fetch(`https://api.telegram.org/bot${ST.telegramToken}/sendMessage`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({chat_id:ST.telegramChatId, text, parse_mode:'HTML'})
      });
      return r.ok;
    }catch{ return false; }
  }
};

// ── PARSING & SCORING ────────────────────────────────────────────
function parseSwap(tx){
  const sw = tx.events?.swap;
  if(!sw) return null;
  const nIn  = Number(sw.nativeInput?.amount  ||0)/1e9;
  const nOut = Number(sw.nativeOutput?.amount ||0)/1e9;
  let action, mint, sol;
  if(nIn>0 && sw.tokenOutputs?.length){
    action='BUY';  sol=nIn;  mint=sw.tokenOutputs[0].mint;
  } else if(nOut>0 && sw.tokenInputs?.length){
    action='SELL'; sol=nOut; mint=sw.tokenInputs[0].mint;
  } else if(sw.tokenOutputs?.length && sw.tokenInputs?.length){
    action='BUY';  sol=0;    mint=sw.tokenOutputs[0].mint;
  } else return null;
  if(!mint) return null;
  return {sig:tx.signature, ts:(tx.timestamp||0)*1000, action, mint, sol, source:tx.source||'UNKNOWN',
          symbol:null, name:null, usdAmt:0, liq:0, mcap:0, age:null, dexPair:null, flags:[], level:'SAFE'};
}

async function enrich(t, solPrice=150){
  const p = await Dex.token(t.mint);
  if(p){
    t.symbol  = p.baseToken?.symbol || t.mint.slice(0,6);
    t.name    = p.baseToken?.name   || 'Unknown';
    t.liq     = p.liquidity?.usd   || 0;
    t.mcap    = p.marketCap        || 0;
    t.age     = p.pairCreatedAt ? Math.round((Date.now()-p.pairCreatedAt)/60000) : null;
    t.usdAmt  = t.sol * solPrice;
    t.dexPair = p.pairAddress ? `https://dexscreener.com/solana/${p.pairAddress}` : null;
  } else {
    t.symbol='???'; t.name='Unknown'; t.usdAmt=t.sol*solPrice;
  }
  // risk flags
  if(t.liq>0 && t.liq<50000)           t.flags.push(t.liq<15000?'VERY_LOW_LIQ':'LOW_LIQ');
  if(t.age!==null && t.age<60)         t.flags.push(t.age<15?'VERY_NEW':'NEW_TOKEN');
  if(t.mcap>0 && t.mcap<100000)        t.flags.push('MICRO_CAP');
  t.level = t.flags.some(f=>f.startsWith('VERY'))?'HIGH':t.flags.length>1?'MEDIUM':t.flags.length?'LOW':'SAFE';
  return t;
}

function computeScore(w){
  const trades=w.trades||[];
  if(!trades.length) return 30;
  const now=Date.now();
  const d7 =trades.filter(t=>now-t.ts<7 *86400000).length;
  const d30=trades.filter(t=>now-t.ts<30*86400000).length;
  const avg=trades.reduce((s,t)=>s+(t.usdAmt||0),0)/trades.length;
  const countScore   =Math.min(100,trades.length*3);
  const activityScore=d7>3?90:d7>0?70:d30>0?40:20;
  const sizeScore    =Math.min(100,avg/8);
  return Math.max(10,Math.min(99,Math.round(countScore*.25+activityScore*.45+sizeScore*.30)));
}

// ── POLLING ──────────────────────────────────────────────────────
let _busy=false, _timer=null;

async function pollWallet(w){
  try{
    const txs = await Helius.getSwaps(w.address,10);
    const seen = new Set(w.seenSigs||[]);
    let added=0;
    for(const tx of txs){
      if(seen.has(tx.signature)) continue;
      const t=parseSwap(tx);
      if(!t) continue;
      await enrich(t);
      w.trades=[t,...(w.trades||[])].slice(0,150);
      seen.add(tx.signature);
      added++;
      if((w.score||30)>=ST.minScore) await sendAlert(w,t);
    }
    w.seenSigs=[...seen].slice(-400);
    w.lastChecked=Date.now(); w.lastError=null;
    w.score=computeScore(w);
    return added;
  }catch(e){
    w.lastError=e.message; w.lastChecked=Date.now(); return 0;
  }
}

async function sendAlert(w,t){
  const id=`a_${t.sig}`;
  if(ST.alerts.some(a=>a.id===id)) return;
  const al={id,walletId:w.id,walletLabel:w.label||fmtAddr(w.address),
    walletAddr:w.address,walletScore:w.score||30,
    action:t.action,token:t.symbol,tokenMint:t.mint,
    val:Math.round(t.usdAmt||0),liq:t.liq,mcap:t.mcap,
    flags:t.flags,level:t.level,ts:t.ts,sig:t.sig,
    sent:false,dexPair:t.dexPair};
  if(ST.telegramToken&&ST.telegramChatId){
    const isBuy=t.action==='BUY';
    const msg=[
      `🔔 <b>WHALE ALERT</b> — Score: ${w.score||30}/100`,
      `👛 ${w.label||fmtAddr(w.address)} <code>${w.address.slice(0,8)}…${w.address.slice(-4)}</code>`,
      `${isBuy?'📈':'📉'} <b>${t.action}</b> $${t.symbol} — $${al.val.toLocaleString()}`,
      t.flags.length?`⚠️ ${t.flags.join(', ')}`:'✅ No risk flags',
      `💧 Liq: $${compact(t.liq)} · MCap: $${compact(t.mcap)}`,
      `🔗 <a href="https://solscan.io/tx/${t.sig}">View TX</a>`+(t.dexPair?` · <a href="${t.dexPair}">Chart</a>`:''),
    ].join('\n');
    al.sent=await TG.send(msg);
  }
  ST.alerts=[al,...ST.alerts].slice(0,500);
}

async function pollAll(){
  if(_busy||!ST.heliusKey||!ST.wallets.length) return;
  _busy=true; setStatus('polling');
  let total=0;
  for(const w of ST.wallets) total+=await pollWallet(w);
  ST.save(); _busy=false; setStatus('live');
  const el=document.getElementById('poll-status');
  if(el) el.textContent=`Last: ${new Date().toLocaleTimeString()}${total?` · +${total} new`:''}`;
  if(['overview','wallets','trades'].includes(currentPage)) render();
}

function startPolling(){
  if(_timer) clearInterval(_timer);
  pollAll();
  _timer=setInterval(pollAll,30000);
}

function setStatus(s){
  const dot=document.getElementById('sdot'), txt=document.getElementById('stxt');
  if(!dot||!txt) return;
  dot.className='status-dot'+(s==='live'?' live':s==='polling'?' polling':'');
  txt.textContent=s==='polling'?'Polling…':s==='live'?'Live':'Idle';
}

// ── HELPERS ──────────────────────────────────────────────────────
function compact(v){
  if(!v) return'0';
  if(v>=1e9) return(v/1e9).toFixed(2)+'B';
  if(v>=1e6) return(v/1e6).toFixed(2)+'M';
  if(v>=1e3) return(v/1e3).toFixed(1)+'k';
  return Math.round(v).toString();
}
function fmtUsd(v){
  if(v==null) return'—';
  const a=Math.abs(v),s=v<0?'-':'';
  if(a>=1e6) return`${s}$${(a/1e6).toFixed(2)}M`;
  if(a>=1e3) return`${s}$${(a/1e3).toFixed(1)}k`;
  return`${s}$${a.toFixed(0)}`;
}
function fmtTime(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return`${s}s ago`;
  const m=Math.floor(s/60); if(m<60)return`${m}m ago`;
  const h=Math.floor(m/60); if(h<24)return`${h}h ago`;
  return`${Math.floor(h/24)}d ago`;
}
function fmtAddr(a){ return`${a.slice(0,6)}…${a.slice(-4)}`; }
function scoreCls(s){ return s>=80?'score-high':s>=60?'score-med':s>=40?'score-low':'score-bad'; }
function riskBadge(lvl){
  const e={SAFE:'🟢',LOW:'🟢',MEDIUM:'🟡',HIGH:'🟠',CRITICAL:'🔴'}[lvl]||'⚪';
  return`<span class="risk-badge risk-${lvl}">${e} ${lvl}</span>`;
}
function flagChips(flags){
  if(!flags?.length) return'<span style="color:var(--success);font-size:11px">✓ Clean</span>';
  return flags.map(f=>`<span class="flag-chip">${f.replace(/_/g,' ')}</span>`).join('');
}
function scoreRing(score,size=72){
  const r=size*.38,cx=size/2,cy=size/2,circ=2*Math.PI*r,off=circ-(score/100)*circ;
  const col=score>=80?'#30c48a':score>=60?'#5b8def':score>=40?'#f0a030':'#e05050';
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2a2a30" stroke-width="5"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="5"
      stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
      stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="central"
      fill="${col}" font-size="${size*.22}" font-weight="700" font-family="Inter,sans-serif">${score}</text>
  </svg>`;
}
function allTrades(){
  return ST.wallets
    .flatMap(w=>(w.trades||[]).map(t=>({...t,walletId:w.id,walletLabel:w.label||fmtAddr(w.address),walletScore:w.score||30})))
    .sort((a,b)=>b.ts-a.ts);
}

// ── ROUTER ───────────────────────────────────────────────────────
const PAGES=[
  {id:'overview', label:'Overview', icon:'◈'},
  {id:'wallets',  label:'Wallets',  icon:'👛'},
  {id:'trades',   label:'Trades',   icon:'📊'},
  {id:'alerts',   label:'Alerts',   icon:'🔔'},
  {id:'settings', label:'Settings', icon:'⚙'},
];
let currentPage='overview', selectedWallet=null, tradeFilter='all';

function navigate(page,data=null){ currentPage=page; selectedWallet=data; render(); }

// ── PAGES ────────────────────────────────────────────────────────
function pageOverview(){
  if(!ST.heliusKey) return pageSetup();
  const trades=allTrades();

// ── ACTIONS ──────────────────────────────────────────────────────
function addWallet(){
  const addr=(document.getElementById('addAddr')?.value||'').trim();
  const label=(document.getElementById('addLabel')?.value||'').trim();
  if(!addr){alert('Enter a Solana address');return;}
  if(!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(addr)){alert('Invalid Solana address');return;}
  if(ST.wallets.some(w=>w.address===addr)){alert('Already tracking');return;}
  const w={id:`w_${Date.now()}`,address:addr,label,addedAt:Date.now(),
            score:30,trades:[],seenSigs:[],lastChecked:null,lastError:null};
  ST.wallets.push(w); ST.save();
  document.getElementById('addAddr').value='';
  document.getElementById('addLabel').value='';
  render();
  pollWallet(w).then(()=>{ST.save();render();});
}

function removeWallet(id){
  if(!confirm('Remove this wallet?')) return;
  ST.wallets=ST.wallets.filter(w=>w.id!==id); ST.save(); navigate('wallets');
}

function clearAllWallets(){
  if(!confirm('Remove all wallets?')) return;
  ST.wallets=[]; ST.save(); render();
}

async function manualPoll(id){
  const w=ST.wallets.find(x=>x.id===id);
  if(!w) return;
  setStatus('polling');
  await pollWallet(w); ST.save(); setStatus('live'); render();
}

async function saveHeliusSetup(){
  const key=(document.getElementById('setup-key')?.value||'').trim();
  if(!key){alert('Enter a key');return;}
  ST.heliusKey=key; ST.save();
  render(); startPolling();
}

async function saveHK(){
  const key=(document.getElementById('s-hk')?.value||'').trim();
  if(!key){alert('Enter a key');return;}
  ST.heliusKey=key; ST.save();
  const el=document.getElementById('hk-res');
  if(el){el.textContent='Testing…';el.style.color='var(--t3)';}
  try{
    await Helius.getSwaps('DRpbCBMxVnDK7maPGv7qLuodEJFefMkGmw8jtKnMDtf7',1);
    if(el){el.textContent='✓ Connected!';el.style.color='var(--success)';}
    startPolling();
  }catch(e){
    if(el){el.textContent=`✗ ${e.message.slice(0,60)}`;el.style.color='var(--danger)';}
  }
}

function saveTG(){
  ST.telegramToken =(document.getElementById('s-tgt')?.value||'').trim();
  ST.telegramChatId=(document.getElementById('s-tgc')?.value||'').trim();
  ST.save();
  const el=document.getElementById('tg-res');
  if(el){el.textContent='✓ Saved';el.style.color='var(--success)';}
}

async function testTG(){
  saveTG();
  const el=document.getElementById('tg-res');
  if(el){el.textContent='Sending…';el.style.color='var(--t3)';}
  const ok=await TG.send('🔔 <b>CryptoTracker</b>\n✅ Telegram alerts are working!');
  if(el){el.textContent=ok?'✓ Sent!':'✗ Failed — check token & chat ID';el.style.color=ok?'var(--success)':'var(--danger)';}
}

function savePrefs(){
  const v=Number(document.getElementById('s-ms')?.value);
  if(isNaN(v)||v<0||v>100){alert('Must be 0–100');return;}
  ST.minScore=v; ST.save();
  const el=document.getElementById('prefs-res');
  if(el){el.textContent='✓ Saved';setTimeout(()=>{if(el)el.textContent='';},2000);}
}

function clearAlerts(){if(!confirm('Clear all alerts?'))return;ST.alerts=[];ST.save();render();}
function clearHistory(){if(!confirm('Clear all trade history?'))return;ST.wallets.forEach(w=>{w.trades=[];w.seenSigs=[];});ST.save();render();}
function factoryReset(){if(!confirm('Factory reset? This cannot be undone.'))return;Object.keys(localStorage).filter(k=>k.startsWith(PFX)).forEach(k=>localStorage.removeItem(k));location.reload();}
function setTF(f){tradeFilter=f;render();}

// ── RENDER ───────────────────────────────────────────────────────
function render(){
  document.getElementById('nav').innerHTML=PAGES.map(p=>`
    <div class="nav-item ${currentPage===p.id||currentPage==='wallet-detail'&&p.id==='wallets'?'active':''}"
         onclick="navigate('${p.id}')">
      <span class="nav-icon">${p.icon}</span>${p.label}
    </div>`).join('');
  let html='';
  if(currentPage==='overview')      html=pageOverview();
  else if(currentPage==='wallets')  html=pageWallets();
  else if(currentPage==='wallet-detail') html=pageWalletDetail(selectedWallet);
  else if(currentPage==='trades')   html=pageTradesGlobal();
  else if(currentPage==='alerts')   html=pageAlerts();
  else if(currentPage==='settings') html=pageSettings();
  document.getElementById('main').innerHTML=html;
  document.getElementById('main').scrollTop=0;
}

Object.assign(window,{navigate,addWallet,removeWallet,clearAllWallets,manualPoll,
  setTF,saveHeliusSetup,saveHK,saveTG,testTG,savePrefs,
  clearAlerts,clearHistory,factoryReset});

// ── INIT ─────────────────────────────────────────────────────────
