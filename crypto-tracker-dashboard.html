<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CryptoTracker — Wallet Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0b;--s1:#111113;--s2:#19191c;--s3:#222226;
  --b1:#2a2a30;--b2:#38383f;--b3:#52525c;
  --t1:#ededef;--t2:#8b8b96;--t3:#4a4a54;
  --hi:#5b8def;--hi2:#4070d4;
  --success:#30c48a;--warn:#f0a030;--danger:#e05050;--orange:#f07030;
  --r:10px;--r2:6px;
  --ff:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--ff);font-size:14px;overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--s1)}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
a{color:inherit;text-decoration:none}
button{font-family:var(--ff);cursor:pointer;border:none;background:none;color:inherit}

/* ── Layout ── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:210px;flex-shrink:0;background:var(--s1);border-right:1px solid var(--b1);display:flex;flex-direction:column;padding:20px 0}
.main{flex:1;overflow-y:auto;padding:28px 32px}

/* ── Sidebar ── */
.logo{padding:0 18px 24px;border-bottom:1px solid var(--b1);margin-bottom:12px}
.logo-name{font-size:15px;font-weight:800;letter-spacing:.04em;color:var(--t1)}
.logo-name span{color:var(--hi)}
.logo-sub{font-size:11px;color:var(--t3);margin-top:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:var(--r2);margin:0 6px;font-size:13.5px;color:var(--t2);cursor:pointer;transition:all .15s;user-select:none}
.nav-item:hover{background:var(--b1);color:var(--t1)}
.nav-item.active{background:rgba(91,141,239,.12);color:var(--hi);font-weight:500}
.nav-icon{width:18px;text-align:center;font-size:14px}
.sidebar-footer{padding:14px 16px;border-top:1px solid var(--b1);margin-top:auto}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--success);margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── Page header ── */
.page-header{margin-bottom:24px}
.page-title{font-size:22px;font-weight:700;color:var(--t1)}
.page-sub{font-size:13px;color:var(--t3);margin-top:4px}

/* ── Cards ── */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:20px}
.card-sm{padding:14px 18px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat-label{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.stat-value{font-size:26px;font-weight:700}
.stat-sub{font-size:12px;color:var(--t3);margin-top:4px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:15px;font-weight:600;color:var(--t1)}
.see-all{font-size:12px;color:var(--hi);cursor:pointer}
.see-all:hover{text-decoration:underline}

/* ── Score badge ── */
.score-badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.score-high{background:rgba(48,196,138,.12);color:var(--success)}
.score-med{background:rgba(91,141,239,.12);color:var(--hi)}
.score-low{background:rgba(240,160,48,.12);color:var(--warn)}
.score-bad{background:rgba(224,80,80,.12);color:var(--danger)}

/* ── Risk badge ── */
.risk-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.risk-LOW{background:rgba(48,196,138,.1);color:var(--success)}
.risk-MEDIUM{background:rgba(240,160,48,.1);color:var(--warn)}
.risk-HIGH{background:rgba(240,112,48,.1);color:var(--orange)}
.risk-CRITICAL{background:rgba(224,80,80,.1);color:var(--danger)}
.flag-chip{display:inline-flex;padding:2px 7px;border-radius:20px;font-size:10.5px;font-weight:500;margin:2px 2px 0 0}

/* ── Action badge ── */
.buy-badge{background:rgba(48,196,138,.1);color:var(--success);font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.sell-badge{background:rgba(224,80,80,.1);color:var(--danger);font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}

/* ── Leaderboard table ── */
.table{width:100%;border-collapse:collapse}
.table th{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:500;padding:0 10px 12px;text-align:left;border-bottom:1px solid var(--b1)}
.table th.r,.table td.r{text-align:right}
.table tr:hover td{background:var(--s2)}
.table td{padding:13px 10px;border-bottom:1px solid rgba(42,42,48,.6);font-size:13.5px}
.wallet-label{font-weight:500;color:var(--t1)}
.wallet-addr{font-size:11px;color:var(--t3);font-family:var(--mono);margin-top:2px}
.pnl-pos{color:var(--success);font-family:var(--mono);font-weight:500}
.pnl-neg{color:var(--danger);font-family:var(--mono);font-weight:500}
.rank{color:var(--t3);font-size:12px}

/* ── Trade feed ── */
.trade-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;transition:border-color .15s}
.trade-card:hover{border-color:var(--b2)}
.trade-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.trade-left{display:flex;align-items:center;gap:10px;min-width:0}
.trade-token{font-size:14px;font-weight:600}
.trade-value{font-size:13px;color:var(--t2);margin-left:6px}
.trade-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:8px;font-size:11.5px;color:var(--t3)}
.trade-meta a{color:var(--hi)}
.trade-meta a:hover{text-decoration:underline}
.trade-pnl{font-family:var(--mono);font-weight:600;font-size:13px}
.time-ago{font-size:12px;color:var(--t3)}

/* ── Wallet detail ── */
.score-ring-wrap{display:flex;align-items:center;gap:20px;margin-bottom:24px}
.wallet-detail-meta{flex:1}
.wallet-detail-name{font-size:20px;font-weight:700}
.wallet-detail-addr{font-size:12px;color:var(--t3);font-family:var(--mono);margin-top:4px}
.progress-bar-bg{background:var(--b1);height:6px;border-radius:3px;flex:1}
.progress-bar-fill{height:6px;border-radius:3px;background:var(--hi);transition:width .6s ease}
.component-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.component-label{font-size:12px;color:var(--t3);width:90px;flex-shrink:0}
.component-score{font-size:12px;color:var(--t2);width:28px;text-align:right;flex-shrink:0}
.component-weight{font-size:11px;color:var(--t3);width:32px;text-align:right;flex-shrink:0}

/* ── Alert feed ── */
.alert-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:14px 16px;margin-bottom:8px}
.alert-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sent-badge{font-size:11px;color:var(--success)}
.unsent-badge{font-size:11px;color:var(--t3)}

/* ── Score ring SVG ── */
.score-ring{flex-shrink:0}

/* ── Tabs ── */
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--s2);padding:3px;border-radius:var(--r2);width:fit-content}
.tab{padding:6px 14px;border-radius:5px;font-size:13px;color:var(--t2);cursor:pointer;transition:all .15s}
.tab.active{background:var(--b1);color:var(--t1);font-weight:500}

/* ── Filter row ── */
.filter-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.filter-btn{padding:6px 14px;border-radius:20px;font-size:12px;border:1px solid var(--b1);color:var(--t2);cursor:pointer;transition:all .15s}
.filter-btn:hover,.filter-btn.active{border-color:var(--hi);color:var(--hi);background:rgba(91,141,239,.08)}

/* ── Empty state ── */
.empty{text-align:center;padding:60px 20px;color:var(--t3)}
.empty-icon{font-size:40px;margin-bottom:12px}

/* ── Add wallet form ── */
.input{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r2);padding:10px 14px;color:var(--t1);font-family:var(--ff);font-size:13.5px;width:100%;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--hi)}
.btn-primary{background:var(--hi);color:#fff;border-radius:var(--r2);padding:10px 18px;font-size:13.5px;font-weight:500;cursor:pointer;transition:background .15s}
.btn-primary:hover{background:var(--hi2)}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;color:var(--t3);margin-bottom:6px;display:block}

/* ── Sparkline ── */
.sparkline{display:inline-flex;align-items:flex-end;gap:2px;height:24px}
.spark-bar{width:4px;border-radius:2px;transition:height .3s}

/* ── Live indicator ── */
.live-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--success);background:rgba(48,196,138,.08);padding:3px 9px;border-radius:20px}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--success);animation:pulse 1.5s infinite}

/* ── Responsive ── */
@media(max-width:900px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .sidebar{width:180px}
  .main{padding:20px}
}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-name">Crypto<span>Tracker</span></div>
      <div class="logo-sub">Wallet Intelligence</div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <div style="font-size:12px;color:var(--t2)">
        <span class="status-dot"></span>Monitor active
      </div>
      <div style="font-size:11px;color:var(--t3);margin-top:4px">Alert-only mode</div>
      <div style="font-size:11px;color:var(--t3);margin-top:2px">Solana · 30s poll</div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main" id="main"></main>
</div>

<script>
// ════════════════════════════════════════════════════════════════════
// MOCK DATA
// ════════════════════════════════════════════════════════════════════

const WALLETS = [
  {id:'w1',address:'DKsTz...W3rq',label:'SOL Whale Alpha',chain:'SOLANA',score:87,status:'ACTIVE',
   pnl:218400,winRate:0.74,medianRoi:92,trades:143,holdHours:18,liqScore:88,drawdown:12,
   cons7d:3200,cons30d:41000,cons90d:218400,
   components:{pnl:95,winRate:88,roi:82,drawdown:88,consistency:91,holdTime:100,liquidity:88},
   source:'nansen-leaked',notes:'Consistent 90d performer, mostly Jupiter swaps',
   recentTrades: genTrades('w1','SOL Whale Alpha')},
  {id:'w2',address:'9WzDX...mkg8',label:'DeFi Hunter',chain:'SOLANA',score:78,status:'ACTIVE',
   pnl:89200,winRate:0.68,medianRoi:54,trades:87,holdHours:6,liqScore:72,drawdown:22,
   cons7d:1400,cons30d:12000,cons90d:89200,
   components:{pnl:78,winRate:76,roi:62,drawdown:78,consistency:74,holdTime:70,liquidity:72},
   source:'manual',notes:'High-frequency trader, good on meme coins',
   recentTrades: genTrades('w2','DeFi Hunter')},
  {id:'w3',address:'FcHzP...9xKm',label:'Pump Detector',chain:'SOLANA',score:71,status:'ACTIVE',
   pnl:44100,winRate:0.61,medianRoi:38,trades:62,holdHours:2.5,liqScore:55,drawdown:31,
   cons7d:800,cons30d:6200,cons90d:44100,
   components:{pnl:62,winRate:65,roi:48,drawdown:69,consistency:58,holdTime:30,liquidity:55},
   source:'twitter',notes:'Mostly pump.fun trader',
   recentTrades: genTrades('w3','Pump Detector')},
  {id:'w4',address:'AhJ2m...Lp7v',label:'Raydium Maxi',chain:'SOLANA',score:63,status:'ACTIVE',
   pnl:28700,winRate:0.57,medianRoi:29,trades:44,holdHours:38,liqScore:80,drawdown:19,
   cons7d:300,cons30d:3800,cons90d:28700,
   components:{pnl:52,winRate:56,roi:38,drawdown:81,consistency:52,holdTime:70,liquidity:80},
   source:'dune',notes:'Raydium LP + trading',
   recentTrades: genTrades('w4','Raydium Maxi')},
  {id:'w5',address:'Bx9Kq...s2Np',label:'New Wallet #1',chain:'SOLANA',score:41,status:'ACTIVE',
   pnl:3200,winRate:0.48,medianRoi:11,trades:8,holdHours:1.2,liqScore:22,drawdown:44,
   cons7d:1100,cons30d:null,cons90d:null,
   components:{pnl:15,winRate:22,roi:14,drawdown:56,consistency:20,holdTime:10,liquidity:22},
   source:'manual',notes:'Too few trades to score reliably',
   recentTrades: genTrades('w5','New Wallet #1')},
  {id:'w6',address:'7tLmN...qP4r',label:'Orca Swimmer',chain:'SOLANA',score:36,status:'PAUSED',
   pnl:-4200,winRate:0.38,medianRoi:-8,trades:23,holdHours:14,liqScore:60,drawdown:58,
   cons7d:-800,cons30d:-4200,cons90d:null,
   components:{pnl:0,winRate:5,roi:0,drawdown:42,consistency:18,holdTime:100,liquidity:60},
   source:'manual',notes:'Consistent loser — possibly adversarial',
   recentTrades: genTrades('w6','Orca Swimmer')},
];

const TOKENS = {
  'BONK':{sym:'BONK',name:'Bonk',liq:8400000,mcap:580000000,age:540},
  'WIF': {sym:'WIF', name:'dogwifhat',liq:12000000,mcap:2100000000,age:720},
  'POPCAT':{sym:'POPCAT',name:'Popcat',liq:3200000,mcap:310000000,age:480},
  'PEPE2':{sym:'PEPE2',name:'Pepe 2.0',liq:48000,mcap:240000,age:18},
  'MOCHI':{sym:'MOCHI',name:'Mochi',liq:92000,mcap:1800000,age:8},
  'SLERF':{sym:'SLERF',name:'Slerf',liq:2100000,mcap:88000000,age:360},
  'MYRO': {sym:'MYRO', name:'Myro',liq:480000,mcap:22000000,age:210},
  'SAMO': {sym:'SAMO', name:'Samoyedcoin',liq:1400000,mcap:62000000,age:1800},
};

const TOKEN_KEYS = Object.keys(TOKENS);

function genTrades(walletId, walletLabel) {
  const now = Date.now();
  const trades = [];
  let i = 0;
  for (const [sym, tok] of Object.entries(TOKENS)) {
    const isBuy = Math.random() > 0.4;
    const val = 800 + Math.random() * 12000;
    const pnl = isBuy ? null : (Math.random() > 0.35 ? val * (0.1 + Math.random() * 1.2) : -val * (0.05 + Math.random() * 0.4));
    const age = tok.age;
    const flags = [];
    const level = tok.liq < 100000 ? (tok.liq < 20000 ? 'HIGH':'MEDIUM') : (age < 30 ? 'MEDIUM' : 'LOW');
    if (tok.liq < 50000) flags.push(tok.liq < 15000 ? 'VERY_LOW_LIQUIDITY' : 'LOW_LIQUIDITY');
    if (age < 30) flags.push(age < 10 ? 'VERY_NEW_TOKEN':'NEW_TOKEN');
    trades.push({
      id:`t_${walletId}_${i}`, walletId, walletLabel, walletScore: WALLETS.find(w=>w.id===walletId)?.score??50,
      action: isBuy ? 'BUY' : 'SELL',
      token: sym, tokenName: tok.name,
      val: Math.round(val), pnl: pnl ? Math.round(pnl) : null,
      liq: tok.liq, mcap: tok.mcap, age,
      flags, level,
      source: ['JUPITER','RAYDIUM','ORCA'][Math.floor(Math.random()*3)],
      ts: now - (i * 3600000 * (0.5 + Math.random() * 8)),
    });
    i++;
  }
  return trades.sort((a,b)=>b.ts-a.ts);
}

// Flatten all trades globally
const ALL_TRADES = WALLETS.flatMap(w => w.recentTrades).sort((a,b)=>b.ts-a.ts);

const ALERTS = ALL_TRADES.slice(0,20).map((t,i)=>({
  id:`a_${i}`,
  walletId: t.walletId, walletLabel: t.walletLabel, walletAddr: WALLETS.find(w=>w.id===t.walletId)?.address,
  walletScore: t.walletScore,
  action: t.action, token: t.token, val: t.val,
  flags: t.flags, level: t.level,
  sent: t.walletScore >= 50 && t.level !== 'CRITICAL',
  ts: t.ts,
}));

// ════════════════════════════════════════════════════════════════════
// ROUTER
// ════════════════════════════════════════════════════════════════════

const PAGES = [
  {id:'overview', label:'Overview',   icon:'◈'},
  {id:'wallets',  label:'Wallets',    icon:'👛'},
  {id:'trades',   label:'Trades',     icon:'📊'},
  {id:'alerts',   label:'Alerts',     icon:'🔔'},
];

let currentPage = 'overview';
let walletFilter = 'all';
let tradeFilter = 'all';
let selectedWallet = null;

function navigate(page, data=null) {
  currentPage = page;
  selectedWallet = data;
  render();
}

// ════════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════════

const fmt = {
  usd(v, compact=true) {
    if(v==null) return '—';
    const abs=Math.abs(v), sign=v<0?'-':'';
    if(compact){
      if(abs>=1e6) return `${sign}$${(abs/1e6).toFixed(2)}M`;
      if(abs>=1e3) return `${sign}$${(abs/1e3).toFixed(1)}k`;
    }
    return `${sign}$${abs.toFixed(0)}`;
  },
  pct(v,d=1){if(v==null)return'—';return`${v>=0?'+':''}${v.toFixed(d)}%`},
  addr(a){return`${a.slice(0,4)}…${a.slice(-4)}`},
  time(ts){
    const s=Math.floor((Date.now()-ts)/1000);
    if(s<60)return`${s}s ago`;
    const m=Math.floor(s/60);if(m<60)return`${m}m ago`;
    const h=Math.floor(m/60);if(h<24)return`${h}h ago`;
    return`${Math.floor(h/24)}d ago`;
  },
};

function scoreCls(s){return s>=80?'score-high':s>=60?'score-med':s>=40?'score-low':'score-bad'}

function scoreRing(score, size=72) {
  const r = size*0.38, cx=size/2, cy=size/2;
  const circ = 2*Math.PI*r;
  const offset = circ - (score/100)*circ;
  const color = score>=80?'#30c48a':score>=60?'#5b8def':score>=40?'#f0a030':'#e05050';
  return `<svg class="score-ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2a2a30" stroke-width="5"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="5"
      stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
      stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="central"
      fill="${color}" font-size="${size*0.22}" font-weight="700" font-family="Inter,sans-serif">${score}</text>
  </svg>`;
}

function riskBadge(level) {
  const e={LOW:'🟢',MEDIUM:'🟡',HIGH:'🟠',CRITICAL:'🔴'}[level]||'⚪';
  return `<span class="risk-badge risk-${level}">${e} ${level}</span>`;
}

function flagChips(flags, level) {
  const colors={LOW:'rgba(48,196,138,.1)',MEDIUM:'rgba(240,160,48,.1)',HIGH:'rgba(240,112,48,.1)',CRITICAL:'rgba(224,80,80,.1)'};
  const tc={LOW:'#30c48a',MEDIUM:'#f0a030',HIGH:'#f07030',CRITICAL:'#e05050'};
  const names={
    LOW_LIQUIDITY:'Low Liq',VERY_LOW_LIQUIDITY:'Very Low Liq',
    NEW_TOKEN:'New Token',VERY_NEW_TOKEN:'Very New (<10m)',
    HIGH_HOLDER_CONCENTRATION:'Concentrated',HONEYPOT_SUSPECTED:'Honeypot',
    PUMP_AND_DUMP_PATTERN:'Pump & Dump',SUSPICIOUS_PRE_BUY_TRANSFER:'Suspicious',
    WALLET_SELLING_INTO_FOLLOWERS:'Selling Into Followers',MICRO_CAP_EXTREME:'Micro Cap',
  };
  if(!flags.length) return '<span style="color:var(--success);font-size:11px">✓ No flags</span>';
  return flags.map(f=>`<span class="flag-chip" style="background:${colors[level]||'#2a2a30'};color:${tc[level]||'#8b8b96'}">${names[f]||f}</span>`).join('');
}

function sparkline(values) {
  const max=Math.max(...values,1);
  return `<div class="sparkline">${values.map(v=>{
    const h=Math.max(3,Math.round((v/max)*24));
    const c=v>=0?'var(--success)':'var(--danger)';
    return`<div class="spark-bar" style="height:${h}px;background:${c}"></div>`;
  }).join('')}</div>`;
}

// ════════════════════════════════════════════════════════════════════
// PAGES
// ════════════════════════════════════════════════════════════════════

function pageOverview() {
  const topWallets = [...WALLETS].sort((a,b)=>b.score-a.score).slice(0,5);
  const recentTrades = ALL_TRADES.slice(0,8);
  const sentAlerts = ALERTS.filter(a=>a.sent).length;
  const totalTrades = ALL_TRADES.length;
  const activeWallets = WALLETS.filter(w=>w.status==='ACTIVE').length;

  return `
<div class="page-header">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div>
      <h1 class="page-title">Overview</h1>
      <p class="page-sub">Wallet intelligence dashboard — alert-only mode</p>
    </div>
    <div class="live-badge"><span class="live-dot"></span>Live</div>
  </div>
</div>

<div class="grid-4" style="margin-bottom:24px">
  ${[
    {label:'Tracked Wallets',value:activeWallets,color:'var(--hi)',sub:`${WALLETS.length} total`},
    {label:'Total Trades',value:totalTrades,color:'var(--success)',sub:'All time'},
    {label:'Alerts Sent',value:sentAlerts,color:'var(--warn)',sub:'To Telegram'},
    {label:'Avg Score',value:Math.round(WALLETS.reduce((s,w)=>s+w.score,0)/WALLETS.length),color:'var(--t1)',sub:'Leaderboard avg'},
  ].map(s=>`<div class="card card-sm">
    <div class="stat-label">${s.label}</div>
    <div class="stat-value" style="color:${s.color}">${s.value}</div>
    <div class="stat-sub">${s.sub}</div>
  </div>`).join('')}
</div>

<div class="grid-2">
  <div>
    <div class="section-header">
      <span class="section-title">Top Wallets</span>
      <span class="see-all" onclick="navigate('wallets')">View all →</span>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <table class="table">
        <thead><tr>
          <th>#</th><th>Wallet</th><th class="r">Score</th><th class="r">PnL</th><th class="r">Win %</th>
        </tr></thead>
        <tbody>${topWallets.map((w,i)=>`<tr style="cursor:pointer" onclick="navigate('wallet-detail','${w.id}')">
          <td class="rank">${i+1}</td>
          <td><div class="wallet-label">${w.label}</div><div class="wallet-addr">${w.address}</div></td>
          <td class="r"><span class="score-badge ${scoreCls(w.score)}">${w.score}</span></td>
          <td class="r ${w.pnl>=0?'pnl-pos':'pnl-neg'}">${fmt.usd(w.pnl)}</td>
          <td class="r" style="color:var(--t2)">${(w.winRate*100).toFixed(0)}%</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
  </div>

  <div>
    <div class="section-header">
      <span class="section-title">Recent Trades</span>
      <span class="see-all" onclick="navigate('trades')">View all →</span>
    </div>
    ${recentTrades.map(t=>tradeMiniCard(t)).join('')}
  </div>
</div>`;
}

function tradeMiniCard(t) {
  const isBuy = t.action==='BUY';
  return `<div class="trade-card">
    <div class="trade-row">
      <div class="trade-left">
        <span class="${isBuy?'buy-badge':'sell-badge'}">${isBuy?'▲ BUY':'▼ SELL'}</span>
        <span class="trade-token">$${t.token}</span>
        <span class="trade-value">${fmt.usd(t.val)}</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        ${t.pnl!=null?`<span class="trade-pnl ${t.pnl>=0?'pnl-pos':'pnl-neg'}">${t.pnl>=0?'+':''}${fmt.usd(t.pnl)}</span>`:''}
        <span class="time-ago">${fmt.time(t.ts)}</span>
      </div>
    </div>
    <div class="trade-meta">
      <span onclick="navigate('wallet-detail','${t.walletId}')" style="cursor:pointer;color:var(--hi)">${t.walletLabel} · ${t.walletScore}pts</span>
      <span>Liq: ${fmt.usd(t.liq)}</span>
      <span>${t.source}</span>
      ${riskBadge(t.level)}
    </div>
  </div>`;
}

function pageWallets() {
  let list = [...WALLETS].sort((a,b)=>b.score-a.score);
  if(walletFilter==='active') list=list.filter(w=>w.status==='ACTIVE');
  if(walletFilter==='paused') list=list.filter(w=>w.status==='PAUSED');

  return `
<div class="page-header">
  <h1 class="page-title">Wallet Leaderboard</h1>
  <p class="page-sub">${WALLETS.filter(w=>w.status==='ACTIVE').length} active wallets tracked on Solana</p>
</div>
<div class="filter-row">
  ${['all','active','paused'].map(f=>`<button class="filter-btn ${walletFilter===f?'active':''}" onclick="setWalletFilter('${f}')">${f.charAt(0).toUpperCase()+f.slice(1)}</button>`).join('')}
</div>
<div class="card" style="padding:0;overflow:hidden">
  <table class="table">
    <thead><tr>
      <th style="width:32px">#</th>
      <th>Wallet</th>
      <th class="r">Score</th>
      <th class="r">Total PnL</th>
      <th class="r">Win Rate</th>
      <th class="r">Median ROI</th>
      <th class="r">Trades</th>
      <th class="r">Trend 7d</th>
      <th class="r">Status</th>
    </tr></thead>
    <tbody>${list.map((w,i)=>{
      const trend = [w.cons7d>0?w.cons7d:-200, -100, 300, 150, w.cons7d||100, 400].map(v=>v*(0.8+Math.random()*.4));
      return`<tr style="cursor:pointer" onclick="navigate('wallet-detail','${w.id}')">
        <td class="rank">${i+1}</td>
        <td>
          <div class="wallet-label">${w.label}</div>
          <div class="wallet-addr">${w.address}</div>
        </td>
        <td class="r"><span class="score-badge ${scoreCls(w.score)}">${w.score}</span></td>
        <td class="r ${w.pnl>=0?'pnl-pos':'pnl-neg'}">${fmt.usd(w.pnl)}</td>
        <td class="r" style="color:var(--t2)">${(w.winRate*100).toFixed(0)}%</td>
        <td class="r ${w.medianRoi>=0?'pnl-pos':'pnl-neg'}">${fmt.pct(w.medianRoi)}</td>
        <td class="r" style="color:var(--t2)">${w.trades}</td>
        <td class="r">${sparkline(trend)}</td>
        <td class="r">
          <span style="font-size:11px;padding:2px 8px;border-radius:20px;${
            w.status==='ACTIVE'?'background:rgba(48,196,138,.1);color:var(--success)':'background:var(--b1);color:var(--t3)'
          }">${w.status}</span>
        </td>
      </tr>`;
    }).join('')}</tbody>
  </table>
</div>

<div class="card" style="margin-top:16px;padding:18px">
  <div class="section-title" style="margin-bottom:14px">Add Wallet</div>
  <div style="display:flex;gap:10px;align-items:flex-end">
    <div style="flex:1"><label class="form-label">Solana Address</label>
      <input class="input" id="addAddr" placeholder="9WzDXwBbmkg8ZTbNMqUxvQRAyrZzDsGYdLVL9zYtAWWM"/></div>
    <div style="flex:0 0 180px"><label class="form-label">Label (optional)</label>
      <input class="input" id="addLabel" placeholder="My Whale"/></div>
    <button class="btn-primary" onclick="addWalletDemo()">Track Wallet</button>
  </div>
</div>`;
}

function addWalletDemo() {
  const addr = document.getElementById('addAddr')?.value?.trim();
  if(!addr){alert('Enter a Solana address');return}
  if(!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(addr)){alert('Invalid Solana address format');return}
  const label = document.getElementById('addLabel')?.value?.trim()||null;
  // In the real system this calls POST /api/wallets
  alert(`✅ Wallet added: ${addr.slice(0,8)}…\n\nIn the live system, the monitor will start polling this wallet within the next 30 seconds.`);
  document.getElementById('addAddr').value='';
  document.getElementById('addLabel').value='';
}

function setWalletFilter(f){walletFilter=f;render()}

function pageWalletDetail(walletId) {
  const w = WALLETS.find(x=>x.id===walletId);
  if(!w) return '<p style="color:var(--danger)">Wallet not found</p>';

  const comps = [
    {label:'Realized PnL',   score:w.components.pnl,       weight:25},
    {label:'Win Rate',       score:w.components.winRate,    weight:20},
    {label:'Median ROI',     score:w.components.roi,        weight:20},
    {label:'Drawdown',       score:w.components.drawdown,   weight:10},
    {label:'Consistency',    score:w.components.consistency,weight:10},
    {label:'Hold Time',      score:w.components.holdTime,   weight:10},
    {label:'Liq Quality',    score:w.components.liquidity,  weight:5},
  ];

  const trades = w.recentTrades;
  const solscan = `https://solscan.io/account/${w.address.replace('…','').slice(0,4)}`;

  return `
<div style="margin-bottom:12px">
  <button onclick="navigate('wallets')" style="color:var(--hi);font-size:13px;cursor:pointer">← Back to leaderboard</button>
</div>

<div class="score-ring-wrap">
  ${scoreRing(w.score, 84)}
  <div class="wallet-detail-meta">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h1 class="wallet-detail-name">${w.label}</h1>
      <span class="score-badge ${scoreCls(w.score)}" style="font-size:13px;padding:4px 12px">${w.score}/100</span>
      <span style="font-size:11px;padding:3px 9px;border-radius:20px;${
        w.status==='ACTIVE'?'background:rgba(48,196,138,.1);color:var(--success)':'background:var(--b1);color:var(--t3)'
      }">${w.status}</span>
    </div>
    <div class="wallet-detail-addr">${w.address}</div>
    <div style="display:flex;gap:10px;margin-top:6px;font-size:12px;color:var(--t3)">
      <span>Source: ${w.source}</span>
      <a href="${solscan}" target="_blank" style="color:var(--hi)">↗ Solscan</a>
    </div>
    ${w.notes?`<div style="font-size:12px;color:var(--t3);margin-top:4px;font-style:italic">${w.notes}</div>`:''}
  </div>
</div>

<div class="grid-4" style="margin-bottom:20px">
  ${[
    {label:'Total PnL',value:fmt.usd(w.pnl),pos:w.pnl>=0,mono:true},
    {label:'Win Rate',value:`${(w.winRate*100).toFixed(0)}%`,pos:w.winRate>0.5},
    {label:'Median ROI',value:fmt.pct(w.medianRoi),pos:w.medianRoi>=0,mono:true},
    {label:'Total Trades',value:w.trades,pos:null},
  ].map(s=>`<div class="card card-sm">
    <div class="stat-label">${s.label}</div>
    <div class="stat-value" style="font-size:22px;color:${s.pos===null?'var(--t1)':s.pos?'var(--success)':'var(--danger)'}">${s.value}</div>
  </div>`).join('')}
</div>

<div class="grid-2" style="margin-bottom:20px">
  <div class="card">
    <div class="section-title" style="margin-bottom:14px">Score Breakdown</div>
    ${comps.map(c=>`<div class="component-row">
      <span class="component-label">${c.label}</span>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width:${c.score}%;background:${c.score>=80?'var(--success)':c.score>=60?'var(--hi)':c.score>=40?'var(--warn)':'var(--danger)'}"></div>
      </div>
      <span class="component-score">${c.score}</span>
      <span class="component-weight">×${c.weight}%</span>
    </div>`).join('')}
  </div>

  <div class="card">
    <div class="section-title" style="margin-bottom:14px">Period Performance</div>
    ${[
      {label:'7d PnL',value:w.cons7d,pct:null},
      {label:'30d PnL',value:w.cons30d,pct:null},
      {label:'90d PnL',value:w.cons90d,pct:null},
      {label:'Avg Hold',value:null,str:`${w.holdHours}h`},
      {label:'Max Drawdown',value:null,str:`${w.drawdown}%`,neg:true},
      {label:'Liq Quality',value:null,str:`${w.liqScore}/100`},
    ].map(m=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b1)">
      <span style="font-size:13px;color:var(--t3)">${m.label}</span>
      <span style="font-size:13px;font-weight:500;${
        m.neg?'color:var(--warn)':
        m.value!=null?(m.value>=0?'color:var(--success);':'color:var(--danger);')+' font-family:var(--mono)':
        'color:var(--t1)'
      }">${m.str||(m.value!=null?fmt.usd(m.value):'—')}</span>
    </div>`).join('')}
  </div>
</div>

<div class="section-title" style="margin-bottom:12px">Recent Trades <span style="color:var(--t3);font-weight:400">(${trades.length})</span></div>
${trades.map(t=>tradeFullCard(t,false)).join('')}`;
}

function pageTradesGlobal() {
  let trades = [...ALL_TRADES];
  if(tradeFilter==='BUY') trades=trades.filter(t=>t.action==='BUY');
  if(tradeFilter==='SELL') trades=trades.filter(t=>t.action==='SELL');
  if(tradeFilter==='risk') trades=trades.filter(t=>t.flags.length>0);

  const buys=ALL_TRADES.filter(t=>t.action==='BUY').length;
  const sells=ALL_TRADES.filter(t=>t.action==='SELL').length;

  return `
<div class="page-header">
  <h1 class="page-title">Trade Feed</h1>
  <p class="page-sub">${ALL_TRADES.length} trades tracked · ${buys} buys · ${sells} sells</p>
</div>
<div class="filter-row">
  ${['all','BUY','SELL','risk'].map(f=>`<button class="filter-btn ${tradeFilter===f?'active':''}" onclick="setTradeFilter('${f}')">${f==='risk'?'⚠ Flagged':f.charAt(0).toUpperCase()+f.slice(1)}</button>`).join('')}
</div>
${trades.slice(0,30).map(t=>tradeFullCard(t,true)).join('')}`;
}

function tradeFullCard(t, showWallet) {
  const isBuy = t.action==='BUY';
  const ageStr = t.age<60?`${t.age}min`:t.age<1440?`${(t.age/60).toFixed(1)}h`:`${(t.age/1440).toFixed(1)}d`;
  return`<div class="trade-card">
    <div class="trade-row">
      <div class="trade-left">
        <span class="${isBuy?'buy-badge':'sell-badge'}">${isBuy?'▲ BUY':'▼ SELL'}</span>
        <span class="trade-token">$${t.token}</span>
        <span class="trade-value">${fmt.usd(t.val)}</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        ${t.pnl!=null?`<span class="trade-pnl ${t.pnl>=0?'pnl-pos':'pnl-neg'}">${t.pnl>=0?'+':''}${fmt.usd(t.pnl)}</span>`:''}
        <span class="time-ago">${fmt.time(t.ts)}</span>
      </div>
    </div>
    <div class="trade-meta">
      ${showWallet?`<span onclick="navigate('wallet-detail','${t.walletId}')" style="cursor:pointer;color:var(--hi)">${t.walletLabel} · ${t.walletScore}pts</span>`:''}
      <span>Liq: ${fmt.usd(t.liq)}</span>
      <span>MCap: ${fmt.usd(t.mcap)}</span>
      <span>Age: ${ageStr}</span>
      <span>${t.source}</span>
      <a href="https://solscan.io" target="_blank">↗ TX</a>
    </div>
    ${t.flags.length?`<div style="margin-top:8px">${flagChips(t.flags,t.level)}</div>`:''}
  </div>`;
}

function setTradeFilter(f){tradeFilter=f;render()}

function pageAlerts() {
  const sent = ALERTS.filter(a=>a.sent).length;
  return `
<div class="page-header">
  <h1 class="page-title">Alert History</h1>
  <p class="page-sub">${ALERTS.length} alerts · ${sent} sent to Telegram</p>
</div>
${ALERTS.map(a=>{
  const isBuy=a.action==='BUY';
  return`<div class="alert-card">
    <div class="alert-row">
      <div style="display:flex;align-items:flex-start;gap:10px;min-width:0">
        ${riskBadge(a.level)}
        <div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
            <span onclick="navigate('wallet-detail','${a.walletId}')" style="cursor:pointer;font-weight:500;color:var(--t1);font-size:13.5px">${a.walletLabel}</span>
            <span class="${isBuy?'buy-badge':'sell-badge'}">${isBuy?'▲ BUY':'▼ SELL'}</span>
            <span style="font-weight:600;color:var(--t1)">$${a.token}</span>
            <span style="color:var(--t2);font-size:13px">${fmt.usd(a.val)}</span>
            <span style="color:var(--t3);font-size:12px">Score: ${a.walletScore}</span>
          </div>
          <div>${flagChips(a.flags,a.level)}</div>
        </div>
      </div>
      <div style="flex-shrink:0;text-align:right">
        <div class="time-ago">${fmt.time(a.ts)}</div>
        <div style="margin-top:4px">${a.sent?'<span class="sent-badge">✓ Sent</span>':'<span class="unsent-badge">Not sent</span>'}</div>
      </div>
    </div>
    ${a.sent?`<div style="margin-top:10px;background:var(--s2);border-radius:var(--r2);padding:12px;font-size:12px;font-family:var(--mono);color:var(--t2);line-height:1.6">
      <span style="color:var(--warn)">🔔</span> <b style="color:var(--t1)">WHALE ALERT</b> — Score: ${a.walletScore}/100<br>
      👛 ${a.walletLabel} · ${a.walletAddr}<br>
      ${isBuy?'📈':'📉'} <b>${a.action}</b> $${a.token} ${fmt.usd(a.val)}<br>
      ${a.flags.length?`⚠️ ${a.flags.length} risk flag${a.flags.length>1?'s':''}<br>`:'✓ No risk flags<br>'}
      🔗 Solscan · 💡 Confidence: <b>${a.walletScore>=80&&a.level==='LOW'?'HIGH':a.walletScore>=65?'MEDIUM':'LOW'}</b>
    </div>`:''}
  </div>`;
}).join('')}`;
}

// ════════════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════════════

function render() {
  // Nav
  document.getElementById('nav').innerHTML = PAGES.map(p=>`
    <div class="nav-item ${currentPage===p.id||currentPage==='wallet-detail'&&p.id==='wallets'?'active':''}"
         onclick="navigate('${p.id}')">
      <span class="nav-icon">${p.icon}</span>${p.label}
    </div>`).join('');

  // Main
  let html = '';
  if(currentPage==='overview')      html = pageOverview();
  else if(currentPage==='wallets')  html = pageWallets();
  else if(currentPage==='wallet-detail') html = pageWalletDetail(selectedWallet);
  else if(currentPage==='trades')   html = pageTradesGlobal();
  else if(currentPage==='alerts')   html = pageAlerts();

  document.getElementById('main').innerHTML = html;
  document.getElementById('main').scrollTop = 0;
}

// Expose navigation to onclick handlers
window.navigate = navigate;
window.setWalletFilter = setWalletFilter;
window.setTradeFilter = setTradeFilter;
window.addWalletDemo = addWalletDemo;

// ════════════════════════════════════════════════════════════════════
// INIT + LIVE SIMULATION
// ════════════════════════════════════════════════════════════════════

render();

// Simulate new trade arriving every 25s
setInterval(()=>{
  const tokens = TOKEN_KEYS;
  const wallet = WALLETS[Math.floor(Math.random()*WALLETS.length)];
  const sym = tokens[Math.floor(Math.random()*tokens.length)];
  const tok = TOKENS[sym];
  const isBuy = Math.random()>0.35;
  const val = Math.round(500+Math.random()*15000);
  const flags=[];
  const level = tok.liq<100000?(tok.liq<20000?'HIGH':'MEDIUM'):(tok.age<30?'MEDIUM':'LOW');
  if(tok.liq<50000) flags.push(tok.liq<15000?'VERY_LOW_LIQUIDITY':'LOW_LIQUIDITY');
  if(tok.age<30) flags.push(tok.age<10?'VERY_NEW_TOKEN':'NEW_TOKEN');

  const newTrade = {
    id:`t_live_${Date.now()}`, walletId:wallet.id, walletLabel:wallet.label, walletScore:wallet.score,
    action:isBuy?'BUY':'SELL', token:sym, tokenName:tok.name,
    val, pnl:isBuy?null:Math.round((Math.random()>0.6?1:-1)*val*(0.1+Math.random()*0.8)),
    liq:tok.liq, mcap:tok.mcap, age:tok.age, flags, level,
    source:['JUPITER','RAYDIUM','ORCA'][Math.floor(Math.random()*3)], ts:Date.now(),
  };

  ALL_TRADES.unshift(newTrade);
  wallet.recentTrades.unshift(newTrade);
  wallet.trades++;

  // Flash the live badge briefly
  const lb=document.querySelector('.live-badge');
  if(lb){lb.style.background='rgba(48,196,138,.2)';setTimeout(()=>{if(lb)lb.style.background='rgba(48,196,138,.08)'},800)}

  if(currentPage==='overview'||currentPage==='trades') render();
}, 25000);
</script>
</body>
</html>
